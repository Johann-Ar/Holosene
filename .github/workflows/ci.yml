# Vérifie que le site se compile, à chaque envoi et à chaque pull request. La publication est faite par Vercel
# (projet relié au dépôt : aperçu pour chaque branche, production depuis la branche par défaut).
name: Vérification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run todo
